server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# Pas de numéro de version de nginx dans les en-têtes
	server_tokens off;

	# Redirections relatives : garde le https et le domaine de Dokploy (/realisations -> /realisations/)
	absolute_redirect off;

	gzip on;
	gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

	# Fichiers générés par Astro : nom unique à chaque build, donc mis en cache longtemps
	location /_astro/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	location / {
		try_files $uri $uri/ =404;
	}

	error_page 404 /404.html;
}
